server {
    listen 80;
    listen [::]:80;
    server_name softkoredigital.co.za;

    return 301 https://www.softkoredigital.co.za$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.softkoredigital.co.za 128.140.50.160;

    root /var/www/softkoredigital/out;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/snippets/softkore-redirects.conf;

    location = / {
        try_files /index.html =404;
    }

    # Hashed build assets never change: cache aggressively.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts are immutable and cacheable long-term.
    location ~* \.(?:woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static media.
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # HTML is rebuilt and redeployed; revalidate each time.
    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^(.*/)?[^/.]+$ {
        if (-d $request_filename) {
            return 301 $uri/;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
