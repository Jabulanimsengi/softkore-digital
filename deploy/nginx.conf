server {
    listen 80;
    listen [::]:80;
    server_name softkoredigital.co.za;

    return 301 https://www.softkoredigital.co.za$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.softkoredigital.co.za 128.140.50.160;

    root /var/www/softkoredigital/out;
    index index.html;

    include /etc/nginx/snippets/softkore-redirects.conf;

    location = / {
        try_files /index.html =404;
    }

    location ~ ^(.*/)?[^/.]+$ {
        if (-d $request_filename) {
            return 301 $uri/;
        }
        try_files $uri =404;
    }

    location ^~ /api/contact {
        proxy_pass http://127.0.0.1:3099/api/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
